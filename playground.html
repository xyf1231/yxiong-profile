<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letters Playground</title>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.7",
      "react-dom/client": "https://esm.sh/react-dom@19.2.7/client",
      "@kumailnanji/letters": "https://esm.sh/@kumailnanji/letters@0.1.1"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0a0a0f;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header a {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s;
    }
    header a:hover { color: #fff; }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 32px;
      gap: 36px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a1a1aa;
    }
    .control-group input[type="text"] {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .control-group input[type="text"]:focus { border-color: #a855f7; }
    .control-group input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.08);
      outline: none;
    }
    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #a855f7;
      cursor: pointer;
      border: 2px solid #0a0a0f;
    }
    .control-group input[type="color"] {
      -webkit-appearance: none;
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }
    .control-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 10px; }
    .control-group input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
    }
    .range-value {
      font-size: 0.85rem;
      color: #d4d4d8;
      font-variant-numeric: tabular-nums;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: #d4d4d8;
      cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #a855f7;
    }
    .preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 360px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }
    .preview::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.12), transparent 50%);
      pointer-events: none;
    }
    .preview-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .preview-svg-wrap {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .word-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: #a1a1aa;
      min-height: 20px;
    }
    .word-indicator .current-preset {
      color: #a855f7;
      font-weight: 600;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #c4b5fd;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    button:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: rgba(168, 85, 247, 0.5);
      color: #fff;
    }
    button.primary {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border: none;
      color: #fff;
    }
    button.primary:hover { opacity: 0.9; }
    button.small {
      padding: 5px 12px;
      font-size: 0.75rem;
    }
    .variant-select, .mode-select, .gradient-type-select {
      display: flex;
      gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 4px;
    }
    .variant-select button, .mode-select button, .gradient-type-select button {
      flex: 1;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #a1a1aa;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .variant-select button.active, .mode-select button.active, .gradient-type-select button.active {
      background: rgba(168, 85, 247, 0.2);
      color: #fff;
    }
    .pool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pool-count {
      font-size: 0.75rem;
      color: #a1a1aa;
    }
    .pool-actions {
      display: flex;
      gap: 6px;
    }
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .filter-tab {
      padding: 5px 12px;
      font-size: 0.75rem;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .filter-tab:hover { color: #fff; background: rgba(255,255,255,0.04); }
    .filter-tab.active {
      background: rgba(168, 85, 247, 0.15);
      color: #fff;
    }
    .gradient-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
    }
    @media (max-width: 768px) {
      .gradient-grid { grid-template-columns: repeat(6, 1fr); }
      .main { padding: 24px 16px; }
      .controls { grid-template-columns: 1fr; }
      .preview-content { padding: 24px 16px; }
    }
    .swatch {
      aspect-ratio: 2.2;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }
    .swatch:hover { transform: scale(1.05); }
    .swatch.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.5);
    }
    .swatch.inactive {
      opacity: 0.3;
      filter: grayscale(0.9);
    }
    .swatch-check {
      position: absolute;
      top: 2px;
      right: 3px;
      color: #fff;
      font-size: 11px;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      display: none;
    }
    .swatch.active .swatch-check { display: block; }
    .swatch-label {
      position: absolute;
      bottom: 2px;
      left: 4px;
      font-size: 9px;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
      pointer-events: none;
    }
    .custom-gradient-controls {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
      padding: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
    }
    .custom-gradient-controls.show { display: flex; }
    .custom-gradient-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .custom-gradient-row .color-input-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .custom-gradient-row .color-input-wrap label {
      font-size: 0.7rem;
      color: #a1a1aa;
    }
    .custom-gradient-row .color-input-wrap input[type="color"] {
      height: 36px;
      border-radius: 8px;
    }
    .export-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 24px;
    }
    .export-section h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .export-section h2::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, #a855f7, #6366f1);
      border-radius: 2px;
    }
    .export-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 8px;
    }
    .export-tab {
      background: transparent;
      border: none;
      color: #a1a1aa;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .export-tab:hover { color: #fff; background: rgba(255,255,255,0.04); }
    .export-tab.active {
      color: #fff;
      background: rgba(168, 85, 247, 0.15);
    }
    .export-panel { display: none; }
    .export-panel.active { display: block; }
    .code-block {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      color: #c4c4c8;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      position: relative;
    }
    .code-block .comment { color: #6a6a6e; }
    .code-block .keyword { color: #c678dd; }
    .code-block .string { color: #98c379; }
    .code-block .number { color: #d19a66; }
    .code-block .tag { color: #e06c75; }
    .code-block .attr { color: #d19a66; }
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #a1a1aa;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .copy-btn.copied {
      background: rgba(39, 174, 96, 0.2);
      border-color: rgba(39, 174, 96, 0.4);
      color: #2ecc71;
    }
    .export-tip {
      font-size: 0.8rem;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .export-tip code {
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #d4d4d8;
    }
    .info {
      font-size: 0.75rem;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Letters Playground</h1>
    <a href="https://github.com/kumailnanji/letters" target="_blank">GitHub ↗</a>
  </header>
  <div class="main">
    <div class="controls">
      <div class="control-group" style="grid-column: 1 / -1;">
        <label>Words</label>
        <input type="text" id="wordsInput" value="Hello, Design, Create" placeholder="Comma or newline separated...">
      </div>
      <div class="control-group">
        <label>Color Mode</label>
        <div class="mode-select" id="modeSelect">
          <button class="active" data-mode="preset">Preset</button>
          <button data-mode="solid">Solid</button>
          <button data-mode="custom">Custom</button>
        </div>
      </div>
      <div class="control-group" id="solidWrap" style="display:none;">
        <label>Solid Color</label>
        <input type="color" id="solidColor" value="#ffffff">
      </div>
      <div class="control-group" id="presetWrap" style="grid-column: 1 / -1;">
        <div class="pool-header">
          <label style="margin:0;">Gradient Pool</label>
          <span class="pool-count" id="selectedCount">30 selected</span>
          <div class="pool-actions">
            <button class="small" id="selectAllBtn">Select All</button>
            <button class="small" id="clearBtn">Clear</button>
            <button class="small" id="shuffleBtn">Shuffle</button>
          </div>
        </div>
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="apple">Apple Tones</button>
          <button class="filter-tab" data-filter="morandi">Morandi</button>
        </div>
        <div class="gradient-grid" id="gradientPool"></div>
      </div>
      <div class="control-group" id="customWrap" style="display:none;">
        <label>Custom Gradient</label>
        <div class="gradient-type-select" id="gradientTypeSelect">
          <button class="active" data-type="linear">Linear</button>
          <button data-type="radial">Radial</button>
        </div>
        <div class="custom-gradient-controls show" id="customGradientControls">
          <div class="custom-gradient-row">
            <div class="color-input-wrap">
              <label>Start Color</label>
              <input type="color" id="customColor1" value="#00ffff">
            </div>
            <div class="color-input-wrap">
              <label>End Color</label>
              <input type="color" id="customColor2" value="#00cccc">
            </div>
          </div>
          <div class="custom-gradient-row" id="angleRow">
            <label>Angle <span class="range-value" id="angleValue">170°</span></label>
            <input type="range" id="angleInput" min="0" max="360" step="5" value="170">
          </div>
        </div>
      </div>
      <div class="control-group">
        <label>Variant</label>
        <div class="variant-select" id="variantSelect">
          <button class="active" data-variant="simple">Simple</button>
          <button data-variant="complex">Complex</button>
        </div>
      </div>
      <div class="control-group">
        <label>Stroke Width <span class="range-value" id="strokeWidthValue">2</span></label>
        <input type="range" id="strokeWidthInput" min="0.5" max="8" step="0.5" value="2">
      </div>
      <div class="control-group">
        <label>Duration <span class="range-value" id="durationValue">2.0s</span></label>
        <input type="range" id="durationInput" min="0.5" max="10" step="0.5" value="2">
      </div>
      <div class="control-group">
        <label>Overlap <span class="range-value" id="overlapValue">0.02</span></label>
        <input type="range" id="overlapInput" min="0" max="0.5" step="0.01" value="0.02">
      </div>
      <div class="control-group">
        <label>Sequence Options</label>
        <label class="checkbox-row">
          <input type="checkbox" id="loopSequenceInput">
          Loop Sequence
        </label>
        <label class="checkbox-row" style="margin-top:6px;">
          <input type="checkbox" id="perWordLoopInput">
          Per-Word Loop
        </label>
      </div>
    </div>
    <div class="preview">
      <div class="preview-content">
        <div class="preview-svg-wrap" id="previewContainer"></div>
        <div class="word-indicator" id="wordIndicator"></div>
        <div class="actions">
          <button id="playBtn" class="primary">Play</button>
          <button id="pauseBtn">Pause</button>
          <button id="nextBtn">Next</button>
          <button id="replayBtn">Replay</button>
          <button id="shuffleBtn2">Shuffle</button>
        </div>
        <p class="info">Powered by @kumailnanji/letters &middot; React</p>
      </div>
    </div>
    <div class="export-section" id="exportSection">
      <h2>Export Code</h2>
      <div class="export-tabs">
        <button class="export-tab active" data-tab="react">React Component</button>
        <button class="export-tab" data-tab="umd">UMD Build</button>
      </div>
      <div class="export-panel active" id="panel-react">
        <div class="export-tip">Copy this code into your React project. Make sure you have installed <code>@kumailnanji/letters</code>.</div>
        <div class="code-block" id="code-react">
          <button class="copy-btn" data-copy="react">Copy</button>
        </div>
      </div>
      <div class="export-panel" id="panel-umd">
        <div class="export-tip">Copy this config object and use with your <code>letters-animation.umd.js</code> build on the main site.</div>
        <div class="code-block" id="code-umd">
          <button class="copy-btn" data-copy="umd">Copy</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as React from 'react';
    import { createRoot } from 'react-dom/client';
    import { Letters } from '@kumailnanji/letters';

    try {
      const { useState, useEffect, useRef, useCallback, useImperativeHandle } = React;
      const h = React.createElement;

      const gradientDefs = {
        midnight: { cat: 'apple', stops: [{ offset: '0%', color: '#08081a' }, { offset: '33%', color: '#181838' }, { offset: '66%', color: '#282858' }, { offset: '100%', color: '#383878' }] },
        graphite: { cat: 'apple', stops: [{ offset: '0%', color: '#161618' }, { offset: '33%', color: '#262628' }, { offset: '66%', color: '#363638' }, { offset: '100%', color: '#464648' }] },
        pacific: { cat: 'apple', stops: [{ offset: '0%', color: '#002848' }, { offset: '33%', color: '#003868' }, { offset: '66%', color: '#004888' }, { offset: '100%', color: '#0058a8' }] },
        alpine: { cat: 'apple', stops: [{ offset: '0%', color: '#182828' }, { offset: '33%', color: '#283838' }, { offset: '66%', color: '#384848' }, { offset: '100%', color: '#485858' }] },
        slate: { cat: 'apple', stops: [{ offset: '0%', color: '#1a2a3a' }, { offset: '33%', color: '#2a3a4a' }, { offset: '66%', color: '#3a4a5a' }, { offset: '100%', color: '#4a5a6a' }] },
        indigo: { cat: 'apple', stops: [{ offset: '0%', color: '#1a1a3a' }, { offset: '33%', color: '#2a2a5a' }, { offset: '66%', color: '#3a3a7a' }, { offset: '100%', color: '#4a4a9a' }] },
        silver: { cat: 'apple', stops: [{ offset: '0%', color: '#707070' }, { offset: '33%', color: '#808080' }, { offset: '66%', color: '#909090' }, { offset: '100%', color: '#a0a0a0' }] },
        'rose-gold': { cat: 'apple', stops: [{ offset: '0%', color: '#a86870' }, { offset: '33%', color: '#b88088' }, { offset: '66%', color: '#c8a0a8' }, { offset: '100%', color: '#d8c0c8' }] },
        sky: { cat: 'apple', stops: [{ offset: '0%', color: '#0a3a5a' }, { offset: '33%', color: '#1a4a6a' }, { offset: '66%', color: '#2a5a7a' }, { offset: '100%', color: '#3a6a8a' }] },
        sage: { cat: 'apple', stops: [{ offset: '0%', color: '#1a3a2a' }, { offset: '33%', color: '#2a4a3a' }, { offset: '66%', color: '#3a5a4a' }, { offset: '100%', color: '#4a6a5a' }] },
        titanium: { cat: 'apple', stops: [{ offset: '0%', color: '#5a5a5a' }, { offset: '33%', color: '#6a6a6a' }, { offset: '66%', color: '#7a7a7a' }, { offset: '100%', color: '#8a8a8a' }] },
        ocean: { cat: 'apple', stops: [{ offset: '0%', color: '#0a2a3a' }, { offset: '33%', color: '#1a3a4a' }, { offset: '66%', color: '#2a4a5a' }, { offset: '100%', color: '#3a5a6a' }] },
        mist: { cat: 'apple', stops: [{ offset: '0%', color: '#5a6a7a' }, { offset: '33%', color: '#6a7a8a' }, { offset: '66%', color: '#7a8a9a' }, { offset: '100%', color: '#8a9aaa' }] },
        orchid: { cat: 'apple', stops: [{ offset: '0%', color: '#4a2a4a' }, { offset: '33%', color: '#5a3a5a' }, { offset: '66%', color: '#6a4a6a' }, { offset: '100%', color: '#7a5a7a' }] },
        bronze: { cat: 'apple', stops: [{ offset: '0%', color: '#4a3a2a' }, { offset: '33%', color: '#5a4a3a' }, { offset: '66%', color: '#6a5a4a' }, { offset: '100%', color: '#7a6a5a' }] },
        'dusty-rose': { cat: 'morandi', stops: [{ offset: '0%', color: '#a07070' }, { offset: '33%', color: '#b08080' }, { offset: '66%', color: '#c09090' }, { offset: '100%', color: '#d0a0a0' }] },
        'muted-sage': { cat: 'morandi', stops: [{ offset: '0%', color: '#5a7a5a' }, { offset: '33%', color: '#6a8a6a' }, { offset: '66%', color: '#7a9a7a' }, { offset: '100%', color: '#8aaa8a' }] },
        'steel-blue': { cat: 'morandi', stops: [{ offset: '0%', color: '#4a5a6a' }, { offset: '33%', color: '#5a6a7a' }, { offset: '66%', color: '#6a7a8a' }, { offset: '100%', color: '#7a8a9a' }] },
        'warm-sand': { cat: 'morandi', stops: [{ offset: '0%', color: '#8a7a5a' }, { offset: '33%', color: '#9a8a6a' }, { offset: '66%', color: '#aa9a7a' }, { offset: '100%', color: '#baaa8a' }] },
        'soft-lilac': { cat: 'morandi', stops: [{ offset: '0%', color: '#6a5a7a' }, { offset: '33%', color: '#7a6a8a' }, { offset: '66%', color: '#8a7a9a' }, { offset: '100%', color: '#9a8aaa' }] },
        terracotta: { cat: 'morandi', stops: [{ offset: '0%', color: '#8a5a4a' }, { offset: '33%', color: '#9a6a5a' }, { offset: '66%', color: '#aa7a6a' }, { offset: '100%', color: '#ba8a7a' }] },
        seafoam: { cat: 'morandi', stops: [{ offset: '0%', color: '#4a7a6a' }, { offset: '33%', color: '#5a8a7a' }, { offset: '66%', color: '#6a9a8a' }, { offset: '100%', color: '#7aaaba' }] },
        'soft-peach': { cat: 'morandi', stops: [{ offset: '0%', color: '#9a7a6a' }, { offset: '33%', color: '#aa8a7a' }, { offset: '66%', color: '#ba9a8a' }, { offset: '100%', color: '#caabaa' }] },
        'dusty-lavender': { cat: 'morandi', stops: [{ offset: '0%', color: '#5a4a6a' }, { offset: '33%', color: '#6a5a7a' }, { offset: '66%', color: '#7a6a8a' }, { offset: '100%', color: '#8a7a9a' }] },
        'olive-gray': { cat: 'morandi', stops: [{ offset: '0%', color: '#6a6a4a' }, { offset: '33%', color: '#7a7a5a' }, { offset: '66%', color: '#8a8a6a' }, { offset: '100%', color: '#9a9a7a' }] },
        'muted-blush': { cat: 'morandi', stops: [{ offset: '0%', color: '#a07070' }, { offset: '33%', color: '#b08080' }, { offset: '66%', color: '#c09090' }, { offset: '100%', color: '#d0a0a0' }] },
        'slate-rose': { cat: 'morandi', stops: [{ offset: '0%', color: '#6a4a5a' }, { offset: '33%', color: '#7a5a6a' }, { offset: '66%', color: '#8a6a7a' }, { offset: '100%', color: '#9a7a8a' }] },
        'cream-stone': { cat: 'morandi', stops: [{ offset: '0%', color: '#9a8a6a' }, { offset: '33%', color: '#aa9a7a' }, { offset: '66%', color: '#baaa8a' }, { offset: '100%', color: '#cabaaa' }] },
        'mint-gray': { cat: 'morandi', stops: [{ offset: '0%', color: '#5a7a6a' }, { offset: '33%', color: '#6a8a7a' }, { offset: '66%', color: '#7a9a8a' }, { offset: '100%', color: '#8aaaba' }] },
        'mauve-gray': { cat: 'morandi', stops: [{ offset: '0%', color: '#6a5a6a' }, { offset: '33%', color: '#7a6a7a' }, { offset: '66%', color: '#8a7a8a' }, { offset: '100%', color: '#9a8a9a' }] }
      };

      function createGradientSvgDefs(presetKey) {
        const def = gradientDefs[presetKey];
        if (!def) return null;
        return h('linearGradient', {
          id: 'letters-gradient',
          x1: '0%', y1: '0%', x2: '100%', y2: '0%',
          gradientUnits: 'userSpaceOnUse'
        }, def.stops.map((stop, i) =>
          h('stop', { key: i, offset: stop.offset, stopColor: stop.color })
        ));
      }

      function createCustomGradientSvgDefs(custom) {
        const { type, color1, color2, angle } = custom;
        if (type === 'radial') {
          return h('radialGradient', {
            id: 'letters-gradient',
            cx: '50%', cy: '50%', r: '50%', fx: '50%', fy: '50%'
          }, [
            h('stop', { key: 0, offset: '0%', stopColor: color1 }),
            h('stop', { key: 1, offset: '100%', stopColor: color2 })
          ]);
        }
        return h('linearGradient', {
          id: 'letters-gradient',
          x1: '0%', y1: '0%', x2: '100%', y2: '0%',
          gradientUnits: 'userSpaceOnUse',
          gradientTransform: `rotate(${angle}, 0.5, 0.5)`
        }, [
          h('stop', { key: 0, offset: '0%', stopColor: color1 }),
          h('stop', { key: 1, offset: '100%', stopColor: color2 })
        ]);
      }

      const SequentialLetters = React.forwardRef((props, ref) => {
        const [step, setStep] = useState(0);
        const [preset, setPreset] = useState(null);
        const lettersRef = useRef(null);
        const timerRef = useRef(null);
        const stepRef = useRef(step);
        stepRef.current = step;

        const {
          words, activePresets, colorMode, solidColor, customGradient,
          variant, strokeWidth, duration, overlap, loopSequence, perWordLoop,
          isPlaying, onPlayingChange, shuffleKey
        } = props;

        const currentIndex = words.length ? step % words.length : 0;
        const currentWord = words[currentIndex] || '';

        const pickPreset = useCallback(() => {
          if (colorMode === 'solid') return null;
          if (colorMode === 'custom') return 'custom';
          if (activePresets.length === 0) return null;
          return activePresets[Math.floor(Math.random() * activePresets.length)];
        }, [colorMode, activePresets]);

        useEffect(() => {
          if (!isPlaying || words.length === 0) {
            clearTimeout(timerRef.current);
            return;
          }
          const newPreset = pickPreset();
          setPreset(newPreset);
          const playTimer = setTimeout(() => {
            if (lettersRef.current?.play) lettersRef.current.play();
          }, 50);
          const animTime = duration * 1000;
          const timer = setTimeout(() => {
            if (perWordLoop && lettersRef.current?.replay) {
              lettersRef.current.replay();
              timerRef.current = setTimeout(() => {
                const next = stepRef.current + 1;
                if (next >= words.length && !loopSequence) {
                  onPlayingChange(false);
                } else {
                  setStep(next % words.length);
                }
              }, animTime + 300);
            } else {
              const next = stepRef.current + 1;
              if (next >= words.length && !loopSequence) {
                onPlayingChange(false);
              } else {
                setStep(next % words.length);
              }
            }
          }, animTime + 600);
          timerRef.current = timer;
          return () => {
            clearTimeout(playTimer);
            clearTimeout(timer);
            clearTimeout(timerRef.current);
          };
        }, [isPlaying, step, shuffleKey, pickPreset, duration, perWordLoop, words.length, loopSequence, onPlayingChange]);

        useImperativeHandle(ref, () => ({
          next: () => {
            const next = stepRef.current + 1;
            if (next >= words.length && !loopSequence) {
              onPlayingChange(false);
              return;
            }
            setStep(next % words.length);
            onPlayingChange(true);
          },
          replay: () => {
            if (lettersRef.current?.replay) lettersRef.current.replay();
          }
        }), [words.length, loopSequence, onPlayingChange]);

        let svgDefs = null;
        let color = '#ffffff';
        if (colorMode === 'preset' && preset) {
          svgDefs = createGradientSvgDefs(preset);
          color = 'url(#letters-gradient)';
        } else if (colorMode === 'custom') {
          svgDefs = createCustomGradientSvgDefs(customGradient);
          color = 'url(#letters-gradient)';
        } else if (colorMode === 'solid') {
          color = solidColor;
        }

        return h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '12px', width: '100%' } },
          h('div', { style: { fontSize: '0.75rem', color: '#a1a1aa', display: 'flex', alignItems: 'center', gap: '8px' } },
            h('span', null, `${currentIndex + 1} / ${words.length}`),
            preset && h('span', { className: 'current-preset' }, preset)
          ),
          h('div', { style: { width: '100%', height: '200px', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
            h(Letters, {
              key: `${currentWord}-${preset}-${step}`,
              ref: (r) => { lettersRef.current = r; },
              text: currentWord,
              variant: variant,
              strokeWidth: strokeWidth,
              color: color,
              autoPlay: false,
              loop: false,
              overlap: overlap,
              animation: { type: 'tween', duration: duration, ease: 'easeInOut' },
              svgDefs: svgDefs,
              style: { width: '100%', height: '100%' }
            })
          )
        );
      });

      const container = document.getElementById('previewContainer');
      let root = null;
      const seqRef = React.createRef();

      const state = {
        wordsInput: 'Hello, Design, Create',
        activePresets: Object.keys(gradientDefs),
        filter: 'all',
        colorMode: 'preset',
        solidColor: '#ffffff',
        customGradient: { type: 'linear', color1: '#00ffff', color2: '#00cccc', angle: 170 },
        variant: 'simple',
        strokeWidth: 2,
        duration: 2,
        overlap: 0.02,
        loopSequence: false,
        perWordLoop: false,
        isPlaying: false,
        shuffleKey: 0
      };

      const getWords = () => state.wordsInput.split(/[,\n]+/).map(w => w.trim()).filter(w => w);

      function renderPool() {
        const pool = document.getElementById('gradientPool');
        const keys = Object.keys(gradientDefs).filter(k => {
          if (state.filter === 'all') return true;
          return gradientDefs[k].cat === state.filter;
        });
        pool.innerHTML = '';
        keys.forEach(key => {
          const def = gradientDefs[key];
          const gradient = `linear-gradient(90deg, ${def.stops.map(s => s.color).join(', ')})`;
          const isActive = state.activePresets.includes(key);
          const swatch = document.createElement('div');
          swatch.className = 'swatch' + (isActive ? ' active' : ' inactive');
          swatch.style.background = gradient;
          swatch.dataset.preset = key;
          swatch.title = key;
          swatch.innerHTML = '<span class="swatch-check">✓</span><span class="swatch-label">' + key + '</span>';
          swatch.addEventListener('click', () => {
            if (state.activePresets.includes(key)) {
              state.activePresets = state.activePresets.filter(k => k !== key);
            } else {
              state.activePresets = [...state.activePresets, key];
            }
            renderPool();
            renderPreview();
            updateExport();
          });
          pool.appendChild(swatch);
        });
        document.getElementById('selectedCount').textContent = state.activePresets.length + ' selected';
      }

      function renderPreview() {
        if (!root) {
          root = createRoot(container);
        }
        const words = getWords();
        root.render(
          h(SequentialLetters, {
            key: words.join(','),
            ref: seqRef,
            words: words,
            activePresets: state.activePresets,
            colorMode: state.colorMode,
            solidColor: state.solidColor,
            customGradient: state.customGradient,
            variant: state.variant,
            strokeWidth: state.strokeWidth,
            duration: state.duration,
            overlap: state.overlap,
            loopSequence: state.loopSequence,
            perWordLoop: state.perWordLoop,
            isPlaying: state.isPlaying,
            onPlayingChange: handlePlayingChange,
            shuffleKey: state.shuffleKey
          })
        );
      }

      function handlePlayingChange(playing) {
        state.isPlaying = playing;
        renderPreview();
      }

      function updateVisibility() {
        document.getElementById('solidWrap').style.display = state.colorMode === 'solid' ? 'flex' : 'none';
        document.getElementById('presetWrap').style.display = state.colorMode === 'preset' ? 'flex' : 'none';
        document.getElementById('customWrap').style.display = state.colorMode === 'custom' ? 'flex' : 'none';
      }

      document.getElementById('wordsInput').addEventListener('input', (e) => {
        state.wordsInput = e.target.value;
        renderPreview();
        updateExport();
      });

      document.getElementById('modeSelect').addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON') return;
        document.querySelectorAll('#modeSelect button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.colorMode = e.target.dataset.mode;
        updateVisibility();
        renderPreview();
        updateExport();
      });

      document.getElementById('solidColor').addEventListener('input', (e) => {
        state.solidColor = e.target.value;
        renderPreview();
        updateExport();
      });

      document.getElementById('filterTabs').addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON') return;
        document.querySelectorAll('#filterTabs button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.filter = e.target.dataset.filter;
        renderPool();
      });

      document.getElementById('selectAllBtn').addEventListener('click', () => {
        const keys = Object.keys(gradientDefs).filter(k => {
          if (state.filter === 'all') return true;
          return gradientDefs[k].cat === state.filter;
        });
        state.activePresets = Array.from(new Set([...state.activePresets, ...keys]));
        renderPool();
        renderPreview();
        updateExport();
      });

      document.getElementById('clearBtn').addEventListener('click', () => {
        const keys = Object.keys(gradientDefs).filter(k => {
          if (state.filter === 'all') return true;
          return gradientDefs[k].cat === state.filter;
        });
        state.activePresets = state.activePresets.filter(k => !keys.includes(k));
        renderPool();
        renderPreview();
        updateExport();
      });

      document.getElementById('shuffleBtn').addEventListener('click', () => {
        state.shuffleKey++;
        renderPreview();
      });

      document.getElementById('shuffleBtn2').addEventListener('click', () => {
        state.shuffleKey++;
        renderPreview();
      });

      document.getElementById('variantSelect').addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON') return;
        document.querySelectorAll('#variantSelect button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.variant = e.target.dataset.variant;
        renderPreview();
        updateExport();
      });

      document.getElementById('strokeWidthInput').addEventListener('input', (e) => {
        state.strokeWidth = parseFloat(e.target.value);
        document.getElementById('strokeWidthValue').textContent = state.strokeWidth;
        renderPreview();
        updateExport();
      });

      document.getElementById('durationInput').addEventListener('input', (e) => {
        state.duration = parseFloat(e.target.value);
        document.getElementById('durationValue').textContent = state.duration + 's';
        renderPreview();
        updateExport();
      });

      document.getElementById('overlapInput').addEventListener('input', (e) => {
        state.overlap = parseFloat(e.target.value);
        document.getElementById('overlapValue').textContent = state.overlap;
        renderPreview();
        updateExport();
      });

      document.getElementById('loopSequenceInput').addEventListener('change', (e) => {
        state.loopSequence = e.target.checked;
        renderPreview();
        updateExport();
      });

      document.getElementById('perWordLoopInput').addEventListener('change', (e) => {
        state.perWordLoop = e.target.checked;
        renderPreview();
        updateExport();
      });

      document.getElementById('playBtn').addEventListener('click', () => {
        state.isPlaying = true;
        renderPreview();
      });

      document.getElementById('pauseBtn').addEventListener('click', () => {
        state.isPlaying = false;
        renderPreview();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (seqRef.current?.next) seqRef.current.next();
      });

      document.getElementById('replayBtn').addEventListener('click', () => {
        if (seqRef.current?.replay) seqRef.current.replay();
      });

      document.getElementById('customColor1').addEventListener('input', (e) => {
        state.customGradient.color1 = e.target.value;
        renderPreview();
        updateExport();
      });

      document.getElementById('customColor2').addEventListener('input', (e) => {
        state.customGradient.color2 = e.target.value;
        renderPreview();
        updateExport();
      });

      document.getElementById('angleInput').addEventListener('input', (e) => {
        state.customGradient.angle = parseInt(e.target.value);
        document.getElementById('angleValue').textContent = state.customGradient.angle + '°';
        renderPreview();
        updateExport();
      });

      document.getElementById('gradientTypeSelect').addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON') return;
        document.querySelectorAll('#gradientTypeSelect button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.customGradient.type = e.target.dataset.type;
        document.getElementById('angleRow').style.display = state.customGradient.type === 'radial' ? 'none' : 'flex';
        renderPreview();
        updateExport();
      });

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function highlightCode(code) {
        return code
          .replace(/(\/\/.*$)/gm, '<span class="comment">$1</span>')
          .replace(/('(?:[^'\\]|\\.)*')/g, '<span class="string">$1</span>')
          .replace(/(<[^>]+>)/g, '<span class="tag">$1</span>')
          .replace(/\b(true|false|null)\b/g, '<span class="keyword">$1</span>')
          .replace(/\b(import|from|function|return|const|let|var)\b/g, '<span class="keyword">$1</span>')
          .replace(/\b(\d+\.?\d*)\b/g, '<span class="number">$1</span>');
      }

      function generateReactCode() {
        const words = getWords();
        const activeList = JSON.stringify(state.activePresets);
        return `import * as React from 'react';
import { Letters } from '@kumailnanji/letters';

// See playground.html for full gradientDefs and SequentialLetters source

function App() {
  const [isPlaying, setIsPlaying] = React.useState(false);
  const seqRef = React.useRef(null);
  return (
    <SequentialLetters
      ref={seqRef}
      words={${JSON.stringify(words)}}
      activePresets={${activeList}}
      colorMode="${state.colorMode}"
      solidColor="${state.solidColor}"
      customGradient={${JSON.stringify(state.customGradient)}}
      variant="${state.variant}"
      strokeWidth={${state.strokeWidth}}
      duration={${state.duration}}
      overlap={${state.overlap}}
      loopSequence={${state.loopSequence}}
      perWordLoop={${state.perWordLoop}}
      isPlaying={isPlaying}
      onPlayingChange={setIsPlaying}
    />
  );
}`;
      }

      function generateUmdCode() {
        const words = getWords();
        return `// Config for letters-animation.umd.js
const lettersConfig = {
  words: ${JSON.stringify(words)},
  activePresets: ${JSON.stringify(state.activePresets)},
  colorMode: '${state.colorMode}',
  solidColor: '${state.solidColor}',
  customGradient: ${JSON.stringify(state.customGradient)},
  variant: '${state.variant}',
  strokeWidth: ${state.strokeWidth},
  duration: ${state.duration},
  overlap: ${state.overlap},
  loopSequence: ${state.loopSequence},
  perWordLoop: ${state.perWordLoop}
};`;
      }

      function updateExport() {
        const reactCode = generateReactCode();
        const umdCode = generateUmdCode();
        document.getElementById('code-react').innerHTML = '<button class="copy-btn" data-copy="react">Copy</button>' + highlightCode(reactCode);
        document.getElementById('code-umd').innerHTML = '<button class="copy-btn" data-copy="umd">Copy</button>' + highlightCode(umdCode);
      }

      document.getElementById('exportSection').addEventListener('click', (e) => {
        const tab = e.target.closest('.export-tab');
        if (tab) {
          document.querySelectorAll('.export-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.export-panel').forEach(p => p.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        }
        const copyBtn = e.target.closest('.copy-btn');
        if (copyBtn) {
          const type = copyBtn.dataset.copy;
          const code = type === 'react' ? generateReactCode() : generateUmdCode();
          navigator.clipboard.writeText(code).then(() => {
            copyBtn.textContent = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.textContent = 'Copy';
              copyBtn.classList.remove('copied');
            }, 2000);
          });
        }
      });

      renderPool();
      renderPreview();
      updateVisibility();
      updateExport();
    } catch (err) {
      document.getElementById('previewContainer').innerHTML = '<div style="color:#ff6b6b;padding:40px;text-align:center;">Error: ' + (err?.message || err) + '</div>';
    }
  </script>
</body>
</html>
