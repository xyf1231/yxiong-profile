<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="使用 @kumailnanji/letters 生成手写风格文字动画。"
    />
    <title>Letters 手写文字 | 熊毅丰</title>
    <link rel="preload" href="css/styles.css?v=v1.10.23" as="style" />
    <link rel="stylesheet" href="css/styles.css?v=v1.10.23" />
    <style>
      .letters-page {
        min-height: 100vh;
        background:
          radial-gradient(circle at 78% 18%, rgba(82, 39, 255, 0.06), transparent 28%),
          radial-gradient(circle at 34% 78%, rgba(255, 159, 252, 0.03), transparent 32%),
          linear-gradient(135deg, #000000 0%, #05050a 48%, #000000 100%);
        color: #e4e4e7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .letters-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .letters-header a {
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .letters-header nav {
        display: flex;
        gap: 20px;
      }

      .letters-header nav a {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.85rem;
        font-weight: 600;
        transition: color 0.2s;
      }

      .letters-header nav a:hover { color: #fff; }

      .letters-main {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px 80px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .letters-hero {
        text-align: center;
      }

      .letters-hero h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 6vw, 3.2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #a855f7, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .letters-hero p {
        margin: 0;
        color: rgba(255, 255, 255, 0.55);
        font-size: 1rem;
      }

      #letters-playground {
        width: 100%;
      }

      .letters-info {
        text-align: center;
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.85rem;
        line-height: 1.6;
      }

      .letters-info a {
        color: #a855f7;
        text-decoration: none;
      }

      .letters-info a:hover { text-decoration: underline; }

      @media (max-width: 720px) {
        .letters-header nav { gap: 14px; }
        .letters-main { padding: 32px 16px 60px; }
      }

      /* 滑动条统一 thumb 样式（React inline style 之外兜底） */
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #a855f7;
        cursor: pointer;
        border: 2px solid #0a0a0f;
      }
    </style>
  </head>
  <body class="letters-page">
    <header class="letters-header">
      <a href="index.html" aria-label="返回首页">YX</a>
      <nav aria-label="页面导航">
        <a href="index.html">主页</a>
        <a href="profile.html">简介</a>
        <a href="results.html">成果</a>
      </nav>
    </header>

    <main class="letters-main">
      <section class="letters-hero">
        <h1>Letters 手写文字</h1>
        <p>输入文字，生成手写风格 SVG 路径动画</p>
      </section>

      <div id="letters-playground" aria-label="动画编辑器"></div>

      <p class="letters-info">
        Powered by <a href="https://github.com/kumailnanji/letters" target="_blank" rel="noopener">@kumailnanji/letters</a> · React · UMD
      </p>
    </main>

    <script>
      // letters-animation.umd.js 内部引用 process.env.NODE_ENV，浏览器环境兜底
      if (typeof window.process === "undefined") {
        window.process = { env: { NODE_ENV: "production" } };
      } else if (!window.process.env) {
        window.process.env = { NODE_ENV: "production" };
      } else if (!window.process.env.NODE_ENV) {
        window.process.env.NODE_ENV = "production";
      }
    </script>
    <script src="js/letters-dist/letters-animation.umd.js?v=v1.10.21"></script>
    <script>
      (function () {
        const container = document.getElementById("letters-playground");
        if (!container) return;

        if (typeof window.mountLettersPlayground !== "function") {
          container.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.45);">动画库加载失败，请刷新页面重试。</p>';
          return;
        }

        window.mountLettersPlayground(container, {
          text: "Hello",
          strokeWidth: 2,
          duration: 2,
          ease: "easeInOut",
          loop: true,
          gradient: true,
          variant: "simple",
        });
      })();
    </script>
  </body>
</html>
