<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="使用 @kumailnanji/letters 生成手写风格文字动画。"
    />
    <title>Letters 手写文字 | 熊毅丰</title>
    <link rel="preload" href="css/styles.css?v=v1.10.20" as="style" />
    <link rel="stylesheet" href="css/styles.css?v=v1.10.20" />
    <style>
      .letters-page {
        min-height: 100vh;
        background:
          radial-gradient(circle at 78% 18%, rgba(82, 39, 255, 0.06), transparent 28%),
          radial-gradient(circle at 34% 78%, rgba(255, 159, 252, 0.03), transparent 32%),
          linear-gradient(135deg, #000000 0%, #05050a 48%, #000000 100%);
        color: #e4e4e7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .letters-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .letters-header a {
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .letters-header nav {
        display: flex;
        gap: 20px;
      }

      .letters-header nav a {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.85rem;
        font-weight: 600;
        transition: color 0.2s;
      }

      .letters-header nav a:hover { color: #fff; }

      .letters-main {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px 80px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .letters-hero {
        text-align: center;
      }

      .letters-hero h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 6vw, 3.2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #a855f7, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .letters-hero p {
        margin: 0;
        color: rgba(255, 255, 255, 0.55);
        font-size: 1rem;
      }

      .letters-controls {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 16px;
        align-items: end;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 20px;
      }

      .control-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .control-field label {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }

      .control-field input[type="text"] {
        appearance: none;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px 14px;
        color: #fff;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
        font-family: inherit;
      }

      .control-field input[type="text"]:focus { border-color: #a855f7; }

      .control-field input[type="color"] {
        appearance: none;
        width: 52px;
        height: 40px;
        border: none;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
      }

      .control-field input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
      .control-field input[type="color"]::-webkit-color-swatch {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
      }

      .stroke-control {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 120px;
      }

      .stroke-control label {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }

      .stroke-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .stroke-row input[type="range"] {
        flex: 1;
        -webkit-appearance: none;
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        outline: none;
      }

      .stroke-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #a855f7;
        cursor: pointer;
        border: 2px solid #0a0a0f;
      }

      .stroke-value {
        min-width: 28px;
        text-align: right;
        font-size: 0.85rem;
        color: #d4d4d8;
        font-variant-numeric: tabular-nums;
      }

      .letters-btn {
        appearance: none;
        background: linear-gradient(135deg, #a855f7, #6366f1);
        border: none;
        border-radius: 10px;
        color: #fff;
        padding: 11px 22px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s;
        white-space: nowrap;
      }

      .letters-btn:hover { opacity: 0.9; }
      .letters-btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .letters-preview {
        min-height: 320px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .letters-preview::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.12), transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.09), transparent 50%);
        pointer-events: none;
      }

      #letters-preview-stage {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 720px;
        height: 240px;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .letters-placeholder {
        color: rgba(255, 255, 255, 0.3);
        font-size: 1rem;
      }

      .letters-info {
        text-align: center;
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.85rem;
        line-height: 1.6;
      }

      .letters-info a {
        color: #a855f7;
        text-decoration: none;
      }

      .letters-info a:hover { text-decoration: underline; }

      @media (max-width: 720px) {
        .letters-controls {
          grid-template-columns: 1fr;
        }
        .letters-header nav { gap: 14px; }
        .letters-main { padding: 32px 16px 60px; }
      }
    </style>
  </head>
  <body class="letters-page">
    <header class="letters-header">
      <a href="index.html" aria-label="返回首页">YX</a>
      <nav aria-label="页面导航">
        <a href="index.html">主页</a>
        <a href="profile.html">简介</a>
        <a href="results.html">成果</a>
      </nav>
    </header>

    <main class="letters-main">
      <section class="letters-hero">
        <h1>Letters 手写文字</h1>
        <p>输入文字，生成手写风格 SVG 路径动画</p>
      </section>

      <section class="letters-controls" aria-label="动画参数">
        <div class="control-field">
          <label for="letters-text">文字内容</label>
          <input type="text" id="letters-text" value="Hello" maxlength="60" placeholder="输入要生成的文字" />
        </div>

        <div class="control-field">
          <label for="letters-color">颜色</label>
          <input type="color" id="letters-color" value="#ffffff" />
        </div>

        <div class="stroke-control">
          <label for="letters-stroke">笔画粗细</label>
          <div class="stroke-row">
            <input type="range" id="letters-stroke" min="0.5" max="5" step="0.1" value="2" />
            <span class="stroke-value" id="letters-stroke-value">2</span>
          </div>
        </div>

        <button id="letters-generate" class="letters-btn" type="button">生成动画</button>
      </section>

      <section class="letters-preview" aria-label="动画预览">
        <div id="letters-preview-stage">
          <span class="letters-placeholder">点击「生成动画」查看效果</span>
        </div>
      </section>

      <p class="letters-info">
        Powered by <a href="https://github.com/kumailnanji/letters" target="_blank" rel="noopener">@kumailnanji/letters</a> · React · UMD
      </p>
    </main>

    <script>
      // letters-animation.umd.js 内部引用 process.env.NODE_ENV，浏览器环境需补齐 shim
      if (typeof window.process === "undefined") {
        window.process = { env: { NODE_ENV: "production" } };
      } else if (!window.process.env) {
        window.process.env = { NODE_ENV: "production" };
      } else if (!window.process.env.NODE_ENV) {
        window.process.env.NODE_ENV = "production";
      }
    </script>
    <script src="js/letters-dist/letters-animation.umd.js?v=v1.10.18"></script>
    <script>
      (function () {
        const textInput = document.getElementById("letters-text");
        const colorInput = document.getElementById("letters-color");
        const strokeInput = document.getElementById("letters-stroke");
        const strokeValue = document.getElementById("letters-stroke-value");
        const generateBtn = document.getElementById("letters-generate");
        const stage = document.getElementById("letters-preview-stage");

        let currentRoot = null;
        let isGenerating = false;

        function mount(text, color, strokeWidth) {
          if (typeof window.mountLettersAnimation !== "function") {
            stage.innerHTML = '<span class="letters-placeholder">加载 Letters 动画库失败，请刷新页面重试</span>';
            return;
          }

          // 卸载上一次渲染
          if (currentRoot && typeof currentRoot.unmount === "function") {
            currentRoot.unmount();
          }

          stage.innerHTML = "";
          currentRoot = window.mountLettersAnimation(stage, text, color, strokeWidth);
        }

        function generate() {
          const text = textInput.value.trim() || "Hello";
          const color = colorInput.value;
          const strokeWidth = parseFloat(strokeInput.value) || 2;

          // 限制长度，避免渲染过慢
          const safeText = text.slice(0, 60);

          isGenerating = true;
          generateBtn.disabled = true;
          generateBtn.textContent = "生成中...";

          // 用 setTimeout 让按钮状态先更新
          window.setTimeout(() => {
            mount(safeText, color, strokeWidth);
            isGenerating = false;
            generateBtn.disabled = false;
            generateBtn.textContent = "重新生成";
          }, 30);
        }

        strokeInput.addEventListener("input", () => {
          strokeValue.textContent = strokeInput.value;
        });

        generateBtn.addEventListener("click", generate);

        // 回车快速生成
        textInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") generate();
        });

        // 首次自动生成示例
        window.addEventListener("load", generate);
      })();
    </script>
  </body>
</html>
