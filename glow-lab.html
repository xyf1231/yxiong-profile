<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Border Glow Lab</title>
    <link rel="stylesheet" href="css/border-glow.css" />
    <style>
      :root {
        --bg: #05050a;
        --surface: rgba(255, 255, 255, 0.04);
        --surface-hover: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.08);
        --text: rgba(255, 255, 255, 0.9);
        --muted: rgba(255, 255, 255, 0.5);
        --accent: #2997ff;
        --accent-dim: rgba(41, 151, 255, 0.15);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: rgba(5,5,10,0.85);
        backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
      header p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 18px;
        padding: 18px 24px 0;
        flex: 1;
        min-height: 0;
      }

      /* ── left panel ── */
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        overflow-y: auto;
        max-height: calc(100vh - 180px);
      }
      .panel h2 {
        font-size: 0.82rem;
        font-weight: 700;
        margin-bottom: 14px;
        color: var(--muted);
        letter-spacing: 0.05em;
      }

      .ctrl-group {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .ctrl-group:last-child { margin-bottom: 0; }
      .ctrl-group legend {
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 6px;
      }

      .field {
        display: grid;
        grid-template-columns: 90px 1fr;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .field:last-child { margin-bottom: 0; }
      .field label {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text);
      }
      .field .value { font-size: 0.72rem; color: var(--muted); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .slider-row input[type="range"] {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        background: rgba(255,255,255,0.12);
        border-radius: 2px;
        outline: none;
        border: none;
        padding: 0;
      }
      .slider-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: 2px solid #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      }
      .slider-row input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: 2px solid #fff;
      }

      .color-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .color-row .swatch {
        width: 24px; height: 24px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.15);
        flex-shrink: 0;
        cursor: pointer;
      }
      .color-row input[type="text"] {
        flex: 1;
        background: rgba(0,0,0,0.35);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        color: var(--text);
        font-size: 0.78rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        outline: none;
      }
      .color-row input[type="text"]:focus { border-color: var(--accent); }

      .color-row input[type="color"] {
        position: absolute;
        opacity: 0;
        width: 0; height: 0;
        pointer-events: none;
      }

      /* ── right / preview area ── */
      .preview-area {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
      }
      .preview-cards {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-content: start;
        min-height: 280px;
      }

      .sample-card {
        padding: 28px 22px;
        min-height: 120px;
      }
      .sample-card h3 {
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .sample-card p {
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.5;
      }
      .sample-card.wide { grid-column: 1 / -1; }

      /* ── code output ── */
      .code-section {
        padding: 18px 24px 24px;
      }
      .code-section h2 {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }
      .code-section pre {
        background: rgba(0,0,0,0.4);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, "Cascadia Code", monospace;
        font-size: 0.8rem;
        line-height: 1.65;
        color: #e4e4e7;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .code-section pre .hl { color: #7dd3fc; }
      .code-section pre .str { color: #a5f3fc; }
      .code-section pre .num { color: #fde68a; }
      .code-section pre .kw { color: #c084fc; }
      .code-section pre .cm { color: #6b7280; }

      .copy-btn {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
        padding: 5px 12px;
        font-size: 0.72rem;
        font-weight: 700;
        cursor: pointer;
        float: right;
        margin-top: -32px;
        position: relative;
        z-index: 1;
        transition: all 0.16s;
      }
      .copy-btn:hover { background: var(--surface-hover); color: var(--text); }
      .copy-btn.copied { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 0;
      }
      .toggle-row input[type="checkbox"] {
        width: 18px; height: 18px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .toggle-row span { font-size: 0.78rem; font-weight: 600; }

      .reset-btn {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        padding: 6px 14px;
        font-size: 0.76rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.16s;
        margin-top: 6px;
        width: 100%;
      }
      .reset-btn:hover { background: var(--surface-hover); color: var(--text); }

      @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; }
        .panel { max-height: none; }
        .preview-cards { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Border Glow · 特效实验室</h1>
        <p>实时调节卡片边缘发光参数，下方查看代码</p>
      </div>
      <button id="btn-reset" class="reset-btn" style="width:auto;padding:6px 16px;margin:0;">重置默认</button>
    </header>

    <div class="layout">
      <!-- left: controls -->
      <div class="panel" id="controls-panel"><!-- populated by JS --></div>

      <!-- right: preview + code -->
      <div class="preview-area">
        <div class="preview-cards" id="card-container">
          <div class="sample-card border-glow-card">
            <div class="border-glow-inner">
              <h3>研究卡片</h3>
              <p>将鼠标移入/移出查看边缘发光效果。<br>发光强度、颜色、范围等参数可通过左侧面板调节。</p>
            </div>
          </div>
          <div class="sample-card border-glow-card">
            <div class="border-glow-inner">
              <h3>项目卡片</h3>
              <p>发光角度跟随指针位置，<br>实时响应鼠标移动。</p>
            </div>
          </div>
          <div class="sample-card border-glow-card wide">
            <div class="border-glow-inner">
              <h3>通栏宽卡片</h3>
              <p>支持各种宽高比例的卡片。调节「发光半径」控制光晕扩散范围，调节「光束范围」控制发光扇形的宽窄。</p>
            </div>
          </div>
        </div>

        <div class="code-section">
          <h2>参数代码</h2>
          <button class="copy-btn" id="copy-btn">复制</button>
          <pre id="code-output"></pre>
        </div>
      </div>
    </div>

    <script src="js/border-glow.js"></script>
    <script>
      /* ── defaults ── */
      var DEFAULTS = {
        glowColor: "40 80 80",
        glowRadius: 40,
        glowIntensity: 1.0,
        edgeSensitivity: 30,
        coneSpread: 25,
        fillOpacity: 0.5,
        animated: false,
        colors: ["#c084fc", "#f472b6", "#38bdf8"],
      };

      var P = Object.assign({}, DEFAULTS);
      var applyTimer = null;

      /* ── helpers ── */
      function qs(s, ctx) { return (ctx || document).querySelector(s); }
      function qsa(s, ctx) { return Array.from((ctx || document).querySelectorAll(s)); }

      /* ── render controls ── */
      function renderControls() {
        var panel = document.getElementById("controls-panel");
        panel.innerHTML = "";

        // ── color group ──
        var g1 = fieldset("发光颜色");
        g1.append(rangeField("亮度 HSL", "glowColor", { text: true, val: P.glowColor }));
        g1.append(triColorField());
        panel.appendChild(g1);

        // ── geometry group ──
        var g2 = fieldset("几何参数");
        g2.append(rangeField("发光半径", "glowRadius", { min: 0, max: 120, step: 1, unit: "px", val: P.glowRadius }));
        g2.append(rangeField("光束范围", "coneSpread", { min: 5, max: 50, step: 1, val: P.coneSpread }));
        g2.append(rangeField("卡片圆角", "_borderRadius", { text: true, val: P._borderRadius || "clamp(22px, 2.4vw, 32px)" }));
        panel.appendChild(g2);

        // ── intensity group ──
        var g3 = fieldset("强度与透明度");
        g3.append(rangeField("发光强度", "glowIntensity", { min: 0.1, max: 3, step: 0.1, val: P.glowIntensity }));
        g3.append(rangeField("边缘敏感度", "edgeSensitivity", { min: 0, max: 100, step: 1, val: P.edgeSensitivity }));
        g3.append(rangeField("填充不透明度", "fillOpacity", { min: 0, max: 1, step: 0.05, val: P.fillOpacity }));
        panel.appendChild(g3);

        // ── animation group ──
        var g4 = fieldset("动画");
        var trow = document.createElement("div");
        trow.className = "toggle-row";
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = P.animated;
        cb.addEventListener("change", function() {
          P.animated = cb.checked;
          scheduleApply();
        });
        var tl = document.createElement("span");
        tl.textContent = "入场扫光动画";
        trow.appendChild(cb);
        trow.appendChild(tl);
        g4.appendChild(trow);
        panel.appendChild(g4);

        // ── reset ──
        var resetBtn = document.createElement("button");
        resetBtn.className = "reset-btn";
        resetBtn.textContent = "重置为默认值";
        resetBtn.addEventListener("click", function() {
          Object.keys(DEFAULTS).forEach(function(k) { P[k] = DEFAULTS[k]; });
          delete P._borderRadius;
          renderControls();
          applyGlow();
        });
        panel.appendChild(resetBtn);
      }

      function fieldset(title) {
        var fs = document.createElement("fieldset");
        fs.className = "ctrl-group";
        var leg = document.createElement("legend");
        leg.textContent = title;
        fs.appendChild(leg);
        return fs;
      }

      function rangeField(label, key, opts) {
        opts = opts || {};
        var row = document.createElement("div");
        row.className = "field";

        var lbl = document.createElement("label");
        lbl.textContent = label;
        row.appendChild(lbl);

        if (opts.text) {
          // text input for complex values
          var inner = document.createElement("div");
          inner.style.cssText = "display:flex;align-items:center;gap:6px;";
          var inp = document.createElement("input");
          inp.type = "text";
          inp.value = opts.val;
          inp.style.cssText = "flex:1;background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--text);font-size:0.78rem;font-family:ui-monospace,monospace;outline:none;";
          inp.addEventListener("input", function() {
            P[key] = inp.value;
            scheduleApply();
          });
          inner.appendChild(inp);
          row.appendChild(inner);
          return row;
        }

        var inner = document.createElement("div");
        inner.className = "slider-row";

        var sl = document.createElement("input");
        sl.type = "range";
        sl.min = opts.min; sl.max = opts.max; sl.step = opts.step || 1;
        sl.value = opts.val;

        var valSpan = document.createElement("span");
        valSpan.className = "value";
        valSpan.textContent = opts.val + (opts.unit || "");

        function update(v) {
          var num = parseFloat(v);
          if (Number.isNaN(num)) return;
          num = Math.max(opts.min, Math.min(opts.max, num));
          P[key] = num;
          valSpan.textContent = num + (opts.unit || "");
          scheduleApply();
        }

        sl.addEventListener("input", function() { update(sl.value); });
        inner.appendChild(sl);
        inner.appendChild(valSpan);

        // number input
        var numInp = document.createElement("input");
        numInp.type = "text";
        numInp.inputMode = "decimal";
        numInp.pattern = "[-+]?[0-9]*\\.?[0-9]*";
        numInp.value = opts.val;
        numInp.style.cssText = "width:52px;background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:6px;padding:4px 6px;color:var(--text);font-size:0.76rem;text-align:center;outline:none;font-family:inherit;";
        numInp.addEventListener("input", function() {
          var v = parseFloat(numInp.value);
          if (Number.isNaN(v)) return;
          v = Math.max(opts.min, Math.min(opts.max, v));
          sl.value = v;
          P[key] = v;
          valSpan.textContent = v + (opts.unit || "");
          scheduleApply();
        });
        numInp.addEventListener("blur", function() {
          var v = parseFloat(numInp.value);
          if (!Number.isNaN(v)) numInp.value = v;
        });
        inner.appendChild(numInp);

        row.appendChild(inner);
        return row;
      }

      function triColorField() {
        var wrapper = document.createElement("div");
        wrapper.style.cssText = "display:flex;flex-direction:column;gap:5px;padding:2px 0;";
        ["渐变色 1", "渐变色 2", "渐变色 3"].forEach(function(lbl, i) {
          var rowC = document.createElement("div");
          rowC.className = "color-row";
          var swatch = document.createElement("span");
          swatch.className = "swatch";
          swatch.style.background = P.colors[i];
          var inp = document.createElement("input");
          inp.type = "text";
          inp.value = P.colors[i];
          var picker = document.createElement("input");
          picker.type = "color";
          picker.value = P.colors[i];
          picker.addEventListener("input", function() {
            P.colors[i] = picker.value;
            inp.value = picker.value;
            swatch.style.background = picker.value;
            scheduleApply();
          });
          swatch.addEventListener("click", function() { picker.click(); });
          inp.addEventListener("input", function() {
            P.colors[i] = inp.value;
            swatch.style.background = inp.value;
            scheduleApply();
          });
          var lblEl = document.createElement("span");
          lblEl.textContent = lbl;
          lblEl.style.cssText = "font-size:0.7rem;color:var(--muted);min-width:62px;";
          rowC.appendChild(lblEl);
          rowC.appendChild(swatch);
          rowC.appendChild(inp);
          rowC.appendChild(picker);
          wrapper.appendChild(rowC);
        });
        return wrapper;
      }

      /* ── apply glow to cards ── */
      function scheduleApply() {
        clearTimeout(applyTimer);
        applyTimer = setTimeout(applyGlow, 40);
      }

      function buildGlowShadows(r) {
        // scale box-shadow values proportional to radius (default 40px = 1.0)
        var s = r / 40;
        function b(v) { return Math.round(v * s); }
        var vars = ["--glow-color", "--glow-color-60", "--glow-color-50", "--glow-color-40",
                     "--glow-color-30", "--glow-color-20", "--glow-color-10"];
        return [
          "inset 0 0 0 " + Math.max(1, b(1)) + "px var(" + vars[0] + ")",
          "inset 0 0 " + b(1) + "px 0 var(" + vars[1] + ")",
          "inset 0 0 " + b(3) + "px 0 var(" + vars[2] + ")",
          "inset 0 0 " + b(6) + "px 0 var(" + vars[3] + ")",
          "inset 0 0 " + b(15) + "px 0 var(" + vars[4] + ")",
          "inset 0 0 " + b(25) + "px " + Math.max(1, b(2)) + "px var(" + vars[5] + ")",
          "inset 0 0 " + b(50) + "px " + Math.max(1, b(2)) + "px var(" + vars[6] + ")",
          "0 0 " + b(1) + "px 0 var(" + vars[1] + ")",
          "0 0 " + b(3) + "px 0 var(" + vars[2] + ")",
          "0 0 " + b(6) + "px 0 var(" + vars[3] + ")",
          "0 0 " + b(15) + "px 0 var(" + vars[4] + ")",
          "0 0 " + b(25) + "px " + Math.max(1, b(2)) + "px var(" + vars[5] + ")",
          "0 0 " + b(50) + "px " + Math.max(1, b(2)) + "px var(" + vars[6] + ")",
        ].join(",\n    ");
      }

      function applyGlow() {
        var cards = qsa(".border-glow-card");
        // reset: remove inline style + event listeners
        cards.forEach(function(c) {
          delete c.dataset.glowPointer;
          delete c.dataset.glowReady;
          delete c.dataset.sweepPlayed;
          c.classList.remove("sweep-active");
          var s = c.style;
          var props = [
            "--edge-sensitivity", "--glow-padding", "--cone-spread", "--fill-opacity",
            "--edge-proximity", "--cursor-angle",
            "--glow-color", "--glow-color-60", "--glow-color-50", "--glow-color-40",
            "--glow-color-30", "--glow-color-20", "--glow-color-10",
            "--gradient-one", "--gradient-two", "--gradient-three", "--gradient-four",
            "--gradient-five", "--gradient-six", "--gradient-seven", "--gradient-base",
          ];
          props.forEach(function(p) { s.removeProperty(p); });
        });

        // remove edge-light elements
        qsa(".border-glow-card > .edge-light").forEach(function(el) { el.remove(); });

        // inject dynamic shadow style scaled by glowRadius
        var shadowStyle = document.getElementById("glow-lab-shadow");
        if (!shadowStyle) {
          shadowStyle = document.createElement("style");
          shadowStyle.id = "glow-lab-shadow";
          document.head.appendChild(shadowStyle);
        }
        var shadows = buildGlowShadows(P.glowRadius);
        var borderRadius = P._borderRadius || "clamp(22px, 2.4vw, 32px)";
        shadowStyle.textContent =
          ".border-glow-card > .edge-light::before {\n" +
          "  box-shadow:\n    " + shadows + ";\n" +
          "}\n" +
          ".border-glow-card {\n" +
          "  --border-radius: " + borderRadius + " !important;\n" +
          "}";

        // call init
        initBorderGlow(cards, {
          glowColor: P.glowColor,
          glowRadius: P.glowRadius,
          glowIntensity: P.glowIntensity,
          edgeSensitivity: P.edgeSensitivity,
          coneSpread: P.coneSpread,
          fillOpacity: P.fillOpacity,
          colors: P.colors,
          animated: P.animated,
        });

        updateCode();
      }

      /* ── code output ── */
      function updateCode() {
        var out = document.getElementById("code-output");
        var lines = [];
        lines.push("initBorderGlow(cards, {");
        lines.push("  glowColor: " + JSON.stringify(P.glowColor) + ",");
        lines.push("  glowRadius: " + P.glowRadius + ",");
        lines.push("  glowIntensity: " + P.glowIntensity + ",");
        lines.push("  edgeSensitivity: " + P.edgeSensitivity + ",");
        lines.push("  coneSpread: " + P.coneSpread + ",");
        lines.push("  fillOpacity: " + P.fillOpacity + ",");
        lines.push("  colors: " + JSON.stringify(P.colors) + ",");
        lines.push("  animated: " + (P.animated ? "true" : "false") + ",");
        lines.push("});");
        out.textContent = lines.join("\n");
      }

      /* ── copy ── */
      document.getElementById("copy-btn").addEventListener("click", function() {
        var text = document.getElementById("code-output").textContent;
        navigator.clipboard.writeText(text).then(function() {
          var btn = document.getElementById("copy-btn");
          btn.textContent = "已复制";
          btn.classList.add("copied");
          setTimeout(function() {
            btn.textContent = "复制";
            btn.classList.remove("copied");
          }, 1800);
        }).catch(function() {});
      });

      /* ── reset ── */
      document.getElementById("btn-reset").addEventListener("click", function() {
        Object.keys(DEFAULTS).forEach(function(k) { P[k] = DEFAULTS[k]; });
        delete P._borderRadius;
        renderControls();
        applyGlow();
      });

      /* ── init ── */
      renderControls();
      applyGlow();
    </script>
  </body>
</html>
