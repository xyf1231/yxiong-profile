<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hershey Handwriting Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 40px;
  }
  .word-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 50px;
  }
  .word-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #c0c0d0;
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .word-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.2);
    color: #fff;
  }
  .word-btn.active {
    background: rgba(120, 119, 198, 0.25);
    border-color: rgba(120, 119, 198, 0.5);
    color: #fff;
  }
  .canvas-area {
    width: 100%;
    max-width: 900px;
    min-height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .stroke-path {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .controls {
    margin-top: 40px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #a0a0b0;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .control-btn:hover {
    background: rgba(255,255,255,0.14);
    color: #fff;
  }
  .speed-label {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.35);
  }
  input[type="range"] {
    width: 120px;
    accent-color: rgba(120, 119, 198, 0.8);
  }
  .info {
    margin-top: 30px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.25);
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>
<h1>Hershey Handwriting Animation</h1>

<div class="word-buttons">
  <button class="word-btn" data-word="loading">loading</button>
  <button class="word-btn" data-word="coming">coming</button>
  <button class="word-btn" data-word="hello">hello</button>
  <button class="word-btn" data-word="welcome">welcome</button>
  <button class="word-btn" data-word="greeting">greeting</button>
</div>

<div class="canvas-area" id="canvas-area">
  <svg id="main-svg" viewBox="0 0 800 200" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#a78bfa"/>
        <stop offset="50%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#f472b6"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<div class="controls">
  <span class="speed-label">Speed</span>
  <input type="range" id="speed" min="0.5" max="4" step="0.5" value="2">
  <button class="control-btn" id="replay">Replay</button>
  <button class="control-btn" id="clear">Clear</button>
</div>

<div class="info">
  Hershey font → Catmull-Rom smoothing → inter-letter connectors → overlap blending<br>
  Click a word to animate
</div>

<script>
// ===== Hershey Font Data (scriptSimple) =====
const HERSHEY = {
  a:{left:-6,right:10,strokes:[[[3,3],[2,1],[0,0],[-2,0],[-4,1],[-5,2],[-6,4],[-6,6],[-5,8],[-3,9],[-1,9],[1,8],[2,6],[4,0],[3,5],[3,8],[4,9],[5,9],[7,8],[8,7],[10,4]]]},
  c:{left:-5,right:6,strokes:[[[2,2],[2,1],[1,0],[-1,0],[-3,1],[-4,2],[-5,4],[-5,6],[-4,8],[-2,9],[1,9],[4,7],[6,4]]]},
  d:{left:-6,right:10,strokes:[[[3,3],[2,1],[0,0],[-2,0],[-4,1],[-5,2],[-6,4],[-6,6],[-5,8],[-3,9],[-1,9],[1,8],[2,6],[8,-12]],[[4,0],[3,5],[3,8],[4,9],[5,9],[7,8],[8,7],[10,4]]]},
  e:{left:-4,right:6,strokes:[[[-3,7],[-1,6],[0,5],[1,3],[1,1],[0,0],[-1,0],[-3,1],[-4,3],[-4,6],[-3,8],[-1,9],[1,9],[3,8],[4,7],[6,4]]]},
  g:{left:-6,right:9,strokes:[[[3,3],[2,1],[0,0],[-2,0],[-4,1],[-5,2],[-6,4],[-6,6],[-5,8],[-3,9],[-1,9],[1,8],[2,7]],[[4,0],[2,7],[-2,18],[-3,20],[-5,21],[-6,20],[-6,18],[-5,15],[-2,12],[1,10],[3,9],[6,7],[9,4]]]},
  h:{left:-5,right:10,strokes:[[[-5,4],[-3,1],[0,-4],[1,-6],[2,-9],[2,-11],[1,-12],[-1,-11],[-2,-9],[-3,-5],[-4,1],[-5,9]],[[-5,9],[-4,6],[-3,4],[-1,1],[1,0],[3,0],[4,1],[4,3],[3,6],[3,8],[4,9],[5,9],[7,8],[8,7],[10,4]]]},
  i:{left:-2,right:5,strokes:[[[1,-5],[1,-4],[2,-4],[2,-5],[1,-5]],[[-2,4],[0,0],[-2,6],[-2,8],[-1,9],[0,9],[2,8],[3,7],[5,4]]]},
  l:{left:-3,right:5,strokes:[[[-3,4],[-1,1],[2,-4],[3,-6],[4,-9],[4,-11],[3,-12],[1,-11],[0,-9],[-1,-5],[-2,2],[-2,8],[-1,9],[0,9],[2,8],[3,7],[5,4]]]},
  m:{left:-13,right:12,strokes:[[[-13,4],[-11,1],[-9,0],[-8,1],[-8,2],[-9,6],[-10,9]],[[-9,6],[-8,4],[-6,1],[-4,0],[-2,0],[-1,1],[-1,2],[-2,6],[-3,9]],[[-2,6],[-1,4],[1,1],[3,0],[5,0],[6,1],[6,3],[5,6],[5,8],[6,9],[7,9],[9,8],[10,7],[12,4]]]},
  n:{left:-8,right:10,strokes:[[[-8,4],[-6,1],[-4,0],[-3,1],[-3,2],[-4,6],[-5,9]],[[-4,6],[-3,4],[-1,1],[1,0],[3,0],[4,1],[4,3],[3,6],[3,8],[4,9],[5,9],[7,8],[8,7],[10,4]]]},
  o:{left:-6,right:8,strokes:[[[0,0],[-2,0],[-4,1],[-5,2],[-6,4],[-6,6],[-5,8],[-3,9],[-1,9],[1,8],[2,7],[3,5],[3,3],[2,1],[0,0],[-1,1],[-1,3],[0,5],[2,6],[5,6],[7,5],[8,4]]]},
  r:{left:-4,right:7,strokes:[[[-4,4],[-2,1],[0,0],[1,1],[1,2],[0,5],[-1,9]],[[0,5],[1,3],[3,1],[5,0],[6,1],[6,2],[5,5],[4,7],[4,9],[5,9],[7,8],[8,7],[10,4]]]},
  t:{left:-4,right:6,strokes:[[[1,2],[1,-1],[1,-4],[0,-6],[-1,-7],[-2,-6],[-2,-4],[-1,-1],[-1,2],[-1,5],[-1,8],[0,9],[2,9],[4,8],[6,6]]]},
  w:{left:-12,right:12,strokes:[[[-12,4],[-10,1],[-8,0],[-7,1],[-7,2],[-8,6],[-9,9]],[[-7,4],[-5,1],[-3,0],[-2,1],[-2,2],[-3,6],[-4,9]],[[-2,4],[0,1],[2,0],[3,1],[3,2],[2,6],[1,9]],[[3,4],[5,1],[7,0],[8,1],[8,2],[7,6],[6,9]]]},
  " ":{left:0,right:16,strokes:[]}
};

function rn(n) { return (Math.round(n * 1000) / 1000).toString(); }

// ===== Catmull-Rom spline → cubic Bézier =====
function catmullRom(points, tension) {
  if (points.length === 0) return "";
  if (points.length === 1) return `M ${rn(points[0][0])} ${rn(points[0][1])}`;
  if (points.length === 2) return `M ${rn(points[0][0])} ${rn(points[0][1])} L ${rn(points[1][0])} ${rn(points[1][1])}`;
  
  const parts = [`M ${rn(points[0][0])} ${rn(points[0][1])}`];
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = i > 0 ? points[i - 1] : points[0];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = i + 2 < points.length ? points[i + 2] : p2;
    const t = tension;
    const cp1x = p1[0] + (p2[0] - p0[0]) / t;
    const cp1y = p1[1] + (p2[1] - p0[1]) / t;
    const cp2x = p2[0] - (p3[0] - p1[0]) / t;
    const cp2y = p2[1] - (p3[1] - p1[1]) / t;
    parts.push(`C ${rn(cp1x)} ${rn(cp1y)}, ${rn(cp2x)} ${rn(cp2y)}, ${rn(p2[0])} ${rn(p2[1])}`);
  }
  return parts.join(" ");
}

function dist(a, b) {
  const dx = a[0] - b[0], dy = a[1] - b[1];
  return Math.sqrt(dx * dx + dy * dy);
}

function polylineLen(pts) {
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += dist(pts[i - 1], pts[i]);
  return len;
}

function smoothConnector(from, to, tension) {
  const d = dist(from, to);
  if (d < 1.2) return null;
  const mid = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2 + d * 0.1];
  return catmullRom([from, mid, to], tension);
}

// ===== Layout word with connectors =====
function layoutWord(text, scale, letterSpacing) {
  const items = [];
  let offsetX = 0;
  let minY = Infinity, maxY = -Infinity;
  
  for (let ci = 0; ci < text.length; ci++) {
    const ch = text[ci];
    const glyph = HERSHEY[ch];
    if (!glyph) { offsetX += 14 * scale + letterSpacing; continue; }
    
    const left = glyph.left || 0;
    const right = glyph.right || 16;
    const strokes = glyph.strokes;
    
    const scaledStrokes = strokes.map(stroke =>
      stroke.map(([x, y]) => {
        const sx = offsetX + (x - left) * scale;
        const sy = y * scale;
        minY = Math.min(minY, sy);
        maxY = Math.max(maxY, sy);
        return [sx, sy];
      })
    );
    
    let prevEnd = null;
    
    for (let si = 0; si < scaledStrokes.length; si++) {
      const pts = scaledStrokes[si];
      if (pts.length === 0) continue;
      
      if (prevEnd && si > 0) {
        const conn = smoothConnector(prevEnd, pts[0], 4);
        if (conn) items.push({ d: conn, type: "conn" });
      }
      
      const d = catmullRom(pts, 4);
      if (d) {
        items.push({ d, type: "body" });
        prevEnd = pts[pts.length - 1];
      }
    }
    
    if (ci < text.length - 1 && prevEnd) {
      const nextCh = text[ci + 1];
      const nextGlyph = HERSHEY[nextCh];
      if (nextGlyph && nextGlyph.strokes.length > 0) {
        const nextLeft = nextGlyph.left || 0;
        const nsp = nextGlyph.strokes[0].map(([x, y]) => [
          offsetX + (right - left) * scale + letterSpacing + (x - nextLeft) * scale,
          y * scale
        ]);
        const conn = smoothConnector(prevEnd, nsp[0], 4);
        if (conn) items.push({ d: conn, type: "conn" });
      }
    }
    
    offsetX += (right - left) * scale + letterSpacing;
  }
  
  return { items, width: offsetX, minY, maxY };
}

// ===== Render =====
function renderWord(text) {
  const svg = document.getElementById("main-svg");
  const defs = svg.querySelector("defs");
  svg.innerHTML = "";
  svg.appendChild(defs);
  
  const scale = 1.6, letterSpacing = 5;
  const { items, width, minY, maxY } = layoutWord(text, scale, letterSpacing);
  
  const padding = 50;
  const h = (maxY - minY) + padding * 2;
  svg.setAttribute("viewBox", `${-padding} ${minY - padding} ${Math.max(width + padding * 2, 100)} ${Math.max(h, 100)}`);
  
  const speed = parseFloat(document.getElementById("speed").value);
  const totalDuration = Math.max((text.length * 0.3 + 0.5) / speed, 0.5);
  
  // Measure all lengths first (paths must be in DOM)
  const tempPaths = [];
  for (const item of items) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", item.d);
    p.style.stroke = "url(#grad1)";
    p.style.fill = "none";
    p.style.strokeLinecap = "round";
    p.style.strokeLinejoin = "round";
    svg.appendChild(p);
    tempPaths.push(p);
  }
  
  // Get lengths
  const lens = tempPaths.map(p => {
    try { return p.getTotalLength(); } catch (e) { return 100; }
  });
  const totalLen = lens.reduce((a, b) => a + b, 0);
  
  // Apply styles with overlap
  const overlap = 0.08;
  let cumLen = 0;
  
  for (let i = 0; i < tempPaths.length; i++) {
    const p = tempPaths[i];
    const len = lens[i];
    const fracStart = totalLen > 0 ? cumLen / totalLen : 0;
    cumLen += len;
    const fracEnd = totalLen > 0 ? cumLen / totalLen : 1;
    
    const span = fracEnd - fracStart;
    const expandedSpan = span * (1 + overlap * 2);
    const adjustedStart = Math.max(0, fracStart - span * overlap);
    
    const segDuration = expandedSpan * totalDuration;
    const segDelay = adjustedStart * totalDuration;
    
    p.classList.add("stroke-path");
    p.style.strokeWidth = items[i].type === "conn" ? "2" : "2.8";
    p.style.strokeDasharray = len + "px";
    p.style.strokeDashoffset = len + "px";
    p.style.transition = `stroke-dashoffset ${segDuration}s cubic-bezier(0.4, 0, 0.25, 1) ${segDelay}s`;
  }
  
  // Trigger animation
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      for (const p of tempPaths) {
        p.style.strokeDashoffset = "0px";
      }
    });
  });
}

function clearSVG() {
  const svg = document.getElementById("main-svg");
  const defs = svg.querySelector("defs");
  svg.innerHTML = "";
  svg.appendChild(defs);
}

// ===== Events =====
document.querySelectorAll(".word-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".word-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderWord(btn.dataset.word);
  });
});
document.getElementById("replay").addEventListener("click", () => {
  const active = document.querySelector(".word-btn.active");
  if (active) renderWord(active.dataset.word);
});
document.getElementById("clear").addEventListener("click", clearSVG);

setTimeout(() => {
  document.querySelector('.word-btn[data-word="hello"]').click();
}, 200);
</script>
</body>
</html>
